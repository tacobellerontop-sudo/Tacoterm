[package]
name = "tacoterm"
version = "0.1.0"
edition = "2021"
description = "A GPU-accelerated terminal emulator for Windows, written in Rust on ConPTY"
license = "MIT"

# The terminal core (grid, VT parser, renderer, config, key mapping) is a
# portable library so it can be unit-tested anywhere; the binary that wires it
# to ConPTY is Windows-only.
[workspace]
# tacoshell, the companion shell, lives in its own crate.
members = ["tacoshell"]

[lib]
name = "tacoterm"
path = "src/lib.rs"

[[bin]]
name = "tacoterm"
path = "src/main.rs"

[dependencies]
# VT / ANSI escape sequence parser
vte = "0.14"
# Windowing + keyboard input
winit = "0.30"
# GPU rendering
wgpu = "30"
# Casting vertex data for the GPU
bytemuck = { version = "1", features = ["derive"] }
# Text shaping, rasterizing + font fallback
cosmic-text = "0.12"
# Blocks on wgpu's async adapter/device setup
pollster = "0.4"
# Column width of wide (CJK, emoji) characters
unicode-width = "0.2"
# Clipboard
arboard = { version = "3", default-features = false }
# Config file
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Decoding pictures shown in the terminal (kitty, sixel, iTerm2 protocols)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# kitty graphics' zlib-compressed payloads
miniz_oxide = "0.9.1"

[target.'cfg(windows)'.dependencies]
# Windows API bindings: ConPTY, pipes, process creation
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.17"

[profile.release]
# Small, fast binary like the rest of the fleet
lto = true
codegen-units = 1
