name: windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Bundle the console that passes pictures through
        run: ./scripts/get-conpty.ps1 -Dest target/release
      - name: Build the installer
        run: ./scripts/build-installer.ps1
      - name: Build the tacoshell installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq tacoshell).version
          & $iscc /Q "/DAppVersion=$version" tacoshell/installer/tacoshell.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload the tacoshell installer
        uses: actions/upload-artifact@v4
        with:
          name: tacoshell-setup
          path: target/tacoshell-installer/tacoshell-setup-*.exe
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tacoterm-windows-x86_64
          path: |
            target/release/tacoterm.exe
            target/release/conpty.dll
            target/release/OpenConsole.exe
            target/release/tacoshell.exe
          if-no-files-found: warn
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: tacoterm-setup
          path: target/installer/*.exe
          if-no-files-found: error
